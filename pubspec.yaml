name: ajyal_reports
description: "Ajyal Al-Quran mobile reports demo with login, OTP, and circle reports."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  http: ^1.2.2
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

  fonts:
    - family: SuisseIntl
      fonts:
        - asset: assets/fonts/SuisseIntl/SuisseIntl-Regular.ttf
          weight: 400
        - asset: assets/fonts/SuisseIntl/SuisseIntl-Medium.ttf
          weight: 500
        - asset: assets/fonts/SuisseIntl/SuisseIntl-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SuisseIntl/SuisseIntl-Bold.ttf
          weight: 700
